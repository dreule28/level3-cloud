apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dreule28/level3-cloud.git
    targetRevision: main
    path: gitops/cluster/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
