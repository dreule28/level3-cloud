---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paas-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dreule28/level3-cloud.git
    targetRevision: main
    path: gitops/apps/paas-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: paas-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
