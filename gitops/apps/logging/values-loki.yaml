deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  limits_config:
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 24
  storage:
    type: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
promtail:
  enabled: true