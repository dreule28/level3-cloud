---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paas
  namespace: paas-ui
spec:
  ingressClassName: nginx
  rules:
    - host: daniel-paas.stackit.gg
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: paas-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paas-ui
                port:
                  number: 80
