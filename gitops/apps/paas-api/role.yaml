---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paas-api-role
  namespace: paas-postgres
rules:
  # Allow managing CNPG clusters (the CRs your API creates)
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Allow reading secrets (for database credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paas-api-binding
  namespace: paas-postgres
subjects:
  - kind: ServiceAccount
    name: paas-api-sa
    namespace: paas-api
roleRef:
  kind: Role
  name: paas-api-role
  apiGroup: rbac.authorization.k8s.io
