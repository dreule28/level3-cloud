---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-api
  namespace: paas-api
spec:
  # replicas: 1
  selector:
    matchLabels:
      app: paas-api
  template:
    metadata:
      labels:
        app: paas-api
    spec:
      imagePullSecrets:
        - name: scr-pull
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: registry.onstackit.cloud/scr-daniel/paas-api:ea7991f
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # bonus -> specify mins and max for hpa requests
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
