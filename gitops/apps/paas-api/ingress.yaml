apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paas-api
  namespace: paas-api
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api-daniel-paas.stackit.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paas-api
                port:
                  number: 80
