---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paas-api-hpa
  namespace: paas-api
spec:
  scaleTargetRef:  # who to watch
    apiVersion: apps/v1
    kind: Deployment
    name: paas-api

  minReplicas: 1
  maxReplicas: 10

  # desiredReplicas = [currentReplicas * (currentMetricValue /
  # targetMetricValue)]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # scales up if above 70%, scales down if below
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # scales up if above 80%, scales down if below
          averageUtilization: 80

  behavior:  # scaling speed
    scaleDown:
      # wait 5 min before scaling down by 50% every 60s
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

    scaleUp:
      stabilizationWindowSeconds: 0  # instantly double pods every 30s
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
