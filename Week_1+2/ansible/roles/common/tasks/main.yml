---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '# \1'


- name: Install dependencies
  ansible.builtin.apt:
    update_cache: true
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"



# ---- Kubernetes repository setup and package installation ----
- name: Add Kubernetes apt key (v1.35)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/kubernetes.gpg

- name: Add Kubernetes apt repo (v1.35)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /
    mode: "0644"

- name: Install containerd + kubelet/kubeadm/kubectl
  ansible.builtin.apt:
    update_cache: true
    name:
      - containerd
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold Kubernetes packages
  ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
  changed_when: false



# ---- Kernel modules + sysctl ----
- name: Ensure required kernel modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load required kernel modules now
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Set sysctl params for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"

- name: Apply sysctl params
  ansible.builtin.command: sysctl --system
  changed_when: false



# ---- containerd config ----
- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Create default containerd config if missing
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false

- name: Write containerd config.toml (only if missing)
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout }}\n"
    mode: "0644"
    force: false

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false\s*$'
    replace: '\1true'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Enable kubelet (it will run fully after init/join)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started

- name: Ensure hostname resolves locally (k8s_ip -> inventory_hostname)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ k8s_ip | regex_escape() }}\s+{{ inventory_hostname }}(\s|$)'
    line: "{{ k8s_ip }} {{ inventory_hostname }}"
    state: present
  when: k8s_ip is defined
