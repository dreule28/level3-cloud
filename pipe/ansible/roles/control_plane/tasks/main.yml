---
# roles/control_plane/tasks/main.yml

# Optional but recommended if you added k8s_ip to inventory (fixed/private IP)
# If you don't have k8s_ip yet, remove the --apiserver-advertise-address line.
- name: Initialize Kubernetes control plane (kubeadm init)
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=10.244.0.0/16
    --cri-socket=unix:///run/containerd/containerd.sock
    {% if hostvars[inventory_hostname].k8s_ip is defined %}
    --apiserver-advertise-address={{ hostvars[inventory_hostname].k8s_ip }}
    {% endif %}
  args:
    creates: /etc/kubernetes/admin.conf

# kubeadm docs: copy admin.conf to user kubeconfig
- name: Ensure kubeconfig directory exists for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copy admin.conf to ubuntu kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

# Flannel: kubeadm init should use 10.244.0.0/16, then apply kube-flannel.yml
- name: Install Flannel CNI
  ansible.builtin.command: >
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_apply
  changed_when: "'configured' in flannel_apply.stdout or 'created' in flannel_apply.stdout"
  failed_when:
    - flannel_apply.rc != 0
    - "'AlreadyExists' not in flannel_apply.stderr"

- name: Wait for Flannel DaemonSet rollout (best effort)
  ansible.builtin.command: kubectl -n kube-system rollout status ds/kube-flannel-ds --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  failed_when: false


# Optional: wait until core system pods are ready-ish
- name: Wait for API server to become Ready (best effort)
  ansible.builtin.shell: |
    set -euo pipefail
    for i in $(seq 1 60); do
      if kubectl get --raw='/readyz?verbose' >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    exit 1
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  failed_when: false

# Create join command (workers will use this)
- name: Create kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Expose join command to other hosts
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_cmd.stdout }}"
